version: '3.8'

# Local development / staging deployment.
# NOTE: POSTGRES_PASSWORD and JWT_SECRET are REQUIRED — compose refuses to
# start without them (no default credentials). Copy .env.example to .env and
# fill in real values first.
#
# Production hardening notes:
#   - Do not publish the db port (remove the `ports` mapping below) so the
#     database is not exposed to the internet.
#   - Use a managed PostgreSQL with TLS and set sslmode=require in DATABASE_URL.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment (see .env.example)}
      POSTGRES_DB: bugbounty
    ports:
      # Dev convenience only — remove in production.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment (see .env.example)}@db:5432/bugbounty
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment (see .env.example)}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_EMAIL_FROM: ${RESEND_EMAIL_FROM:-onboarding@resend.dev}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SANDBOX_API_URL: http://sandbox:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend

volumes:
  pgdata:
